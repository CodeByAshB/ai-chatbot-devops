<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><style>.flow{stroke-dasharray:7 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="830" rx="14" fill="#ffffff" stroke="#d5dbe3"/>
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">ai-chatbot-devops: from git push to a running pod</text>

  <rect x="30" y="60" width="1140" height="260" rx="12" fill="#f3f7fc" stroke="#c9d6e8"/>
  <text x="50" y="88" font-size="15" font-weight="700" fill="#1e3a5f">CI: GitHub Actions (runs on every push to main)</text>

  <rect x="60" y="110" width="150" height="150" rx="10" fill="#ffffff" stroke="#7b93b5" stroke-width="1.5"/>
  <circle cx="135" cy="110" r="13" fill="#2563eb"/><text x="135" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="135" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">git push</text>
  <text x="135" y="178" text-anchor="middle" font-size="12" fill="#374151">Push code to the</text>
  <text x="135" y="196" text-anchor="middle" font-size="12" fill="#374151">main branch on</text>
  <text x="135" y="214" text-anchor="middle" font-size="12" fill="#374151">GitHub</text>

  <rect x="240" y="110" width="150" height="150" rx="10" fill="#ffffff" stroke="#7b93b5" stroke-width="1.5"/>
  <circle cx="315" cy="110" r="13" fill="#2563eb"/><text x="315" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="315" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Security checks</text>
  <text x="315" y="178" text-anchor="middle" font-size="12" fill="#374151">Gitleaks: leaked</text>
  <text x="315" y="196" text-anchor="middle" font-size="12" fill="#374151">secrets in the repo</text>
  <text x="315" y="214" text-anchor="middle" font-size="12" fill="#374151">Bandit: risky code</text>

  <rect x="420" y="110" width="150" height="150" rx="10" fill="#ffffff" stroke="#7b93b5" stroke-width="1.5"/>
  <circle cx="495" cy="110" r="13" fill="#2563eb"/><text x="495" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="495" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Build image</text>
  <text x="495" y="178" text-anchor="middle" font-size="12" fill="#374151">Docker, linux/amd64</text>
  <text x="495" y="196" text-anchor="middle" font-size="12" fill="#374151">Built locally in CI</text>
  <text x="495" y="214" text-anchor="middle" font-size="12" fill="#374151">(not pushed yet)</text>

  <rect x="600" y="110" width="150" height="150" rx="10" fill="#ffffff" stroke="#7b93b5" stroke-width="1.5"/>
  <circle cx="675" cy="110" r="13" fill="#2563eb"/><text x="675" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="675" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Image scan</text>
  <text x="675" y="178" text-anchor="middle" font-size="12" fill="#374151">Trivy checks the</text>
  <text x="675" y="196" text-anchor="middle" font-size="12" fill="#374151">image for HIGH and</text>
  <text x="675" y="214" text-anchor="middle" font-size="12" fill="#374151">CRITICAL CVEs</text>

  <rect x="780" y="110" width="150" height="150" rx="10" fill="#ffffff" stroke="#7b93b5" stroke-width="1.5"/>
  <circle cx="855" cy="110" r="13" fill="#2563eb"/><text x="855" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
  <text x="855" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Push image</text>
  <text x="855" y="178" text-anchor="middle" font-size="12" fill="#374151">Docker Hub gets</text>
  <text x="855" y="196" text-anchor="middle" font-size="12" fill="#374151">:latest and :SHA tags</text>
  <text x="855" y="214" text-anchor="middle" font-size="12" fill="#374151">only if all passed</text>

  <rect x="960" y="110" width="150" height="150" rx="10" fill="#ffffff" stroke="#7b93b5" stroke-width="1.5"/>
  <circle cx="1035" cy="110" r="13" fill="#2563eb"/><text x="1035" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
  <text x="1035" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Update manifest</text>
  <text x="1035" y="178" text-anchor="middle" font-size="12" fill="#374151">Pipeline writes the</text>
  <text x="1035" y="196" text-anchor="middle" font-size="12" fill="#374151">new tag into</text>
  <text x="1035" y="214" text-anchor="middle" font-size="12" fill="#374151">deployment.yaml</text>

  <line x1="210" y1="185" x2="238" y2="185" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="390" y1="185" x2="418" y2="185" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="185" x2="598" y2="185" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="185" x2="778" y2="185" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="930" y1="185" x2="958" y2="185" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="250" y="272" width="130" height="22" rx="11" fill="#fee2e2" stroke="#ef4444"/>
  <text x="315" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">fail = pipeline stops</text>
  <rect x="610" y="272" width="130" height="22" rx="11" fill="#fee2e2" stroke="#ef4444"/>
  <text x="675" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">fail = pipeline stops</text>

  <path d="M855 260 V340 H155 V408" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" class="flow" marker-end="url(#arr)"/>
  <text x="505" y="334" text-anchor="middle" font-size="11" fill="#475569">image is stored on Docker Hub, tagged with the commit SHA</text>
  <line x1="1035" y1="260" x2="1035" y2="408" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1025" y="345" text-anchor="end" font-size="11" fill="#475569">commits the new tag to Git</text>

  <rect x="30" y="360" width="1140" height="295" rx="12" fill="#f4faf1" stroke="#c9dfbf"/>
  <text x="600" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#27552a">CD: GitOps on AWS EC2 (k3s cluster, Mumbai)</text>

  <rect x="50" y="410" width="210" height="120" rx="10" fill="#ffffff" stroke="#7fa874" stroke-width="1.5"/>
  <text x="155" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Docker Hub</text>
  <text x="155" y="468" text-anchor="middle" font-size="12" fill="#374151">Stores the scanned</text>
  <text x="155" y="486" text-anchor="middle" font-size="12" fill="#374151">images; the cluster</text>
  <text x="155" y="504" text-anchor="middle" font-size="12" fill="#374151">pulls the new tag</text>

  <rect x="320" y="410" width="230" height="120" rx="10" fill="#ffffff" stroke="#7fa874" stroke-width="1.5"/>
  <text x="435" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Chatbot pod</text>
  <text x="435" y="468" text-anchor="middle" font-size="12" fill="#374151">Flask app on k3s</text>
  <text x="435" y="486" text-anchor="middle" font-size="12" fill="#374151">Health-checked via /health</text>
  <text x="435" y="504" text-anchor="middle" font-size="12" fill="#374151">Runs the new image tag</text>

  <rect x="610" y="410" width="230" height="120" rx="10" fill="#ffffff" stroke="#7fa874" stroke-width="1.5"/>
  <text x="725" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Argo CD</text>
  <text x="725" y="468" text-anchor="middle" font-size="12" fill="#374151">Runs inside the cluster</text>
  <text x="725" y="486" text-anchor="middle" font-size="12" fill="#374151">Pulls changes from Git</text>
  <text x="725" y="504" text-anchor="middle" font-size="12" fill="#374151">Auto-sync + self-heal</text>

  <rect x="900" y="410" width="250" height="120" rx="10" fill="#ffffff" stroke="#7fa874" stroke-width="1.5"/>
  <text x="1025" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">GitHub repo (main)</text>
  <text x="1025" y="468" text-anchor="middle" font-size="12" fill="#374151">k8s/deployment.yaml</text>
  <text x="1025" y="486" text-anchor="middle" font-size="12" fill="#374151">holds the desired state</text>
  <text x="1025" y="504" text-anchor="middle" font-size="12" fill="#374151">and the new image tag</text>

  <line x1="900" y1="470" x2="842" y2="470" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="470" x2="552" y2="470" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="260" y1="470" x2="318" y2="470" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="320" y="560" width="230" height="75" rx="10" fill="#ffffff" stroke="#7fa874" stroke-width="1.5"/>
  <text x="435" y="584" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Ollama (llama3.2:1b)</text>
  <text x="435" y="606" text-anchor="middle" font-size="12" fill="#374151">Model server in the cluster</text>
  <text x="435" y="623" text-anchor="middle" font-size="12" fill="#374151">Answers /chat requests</text>
  <line x1="435" y1="530" x2="435" y2="558" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="30" y="680" width="1140" height="100" rx="12" fill="#fcf7ee" stroke="#ecd9b8"/>
  <text x="50" y="705" font-size="15" font-weight="700" fill="#7a4d0b">One-time setup: Terraform, then kubectl</text>

  <rect x="50" y="717" width="260" height="52" rx="8" fill="#ffffff" stroke="#d6b27a" stroke-width="1.5"/>
  <text x="180" y="739" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">terraform apply</text>
  <text x="180" y="757" text-anchor="middle" font-size="12" fill="#374151">creates the next two boxes</text>

  <rect x="330" y="717" width="260" height="52" rx="8" fill="#ffffff" stroke="#d6b27a" stroke-width="1.5"/>
  <text x="460" y="739" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Key pair + firewall</text>
  <text x="460" y="757" text-anchor="middle" font-size="12" fill="#374151">SSH only from my IP</text>

  <rect x="610" y="717" width="260" height="52" rx="8" fill="#ffffff" stroke="#d6b27a" stroke-width="1.5"/>
  <text x="740" y="739" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">EC2 server + k3s</text>
  <text x="740" y="757" text-anchor="middle" font-size="12" fill="#374151">installed on first boot</text>

  <rect x="890" y="717" width="260" height="52" rx="8" fill="#ffffff" stroke="#d6b27a" stroke-width="1.5"/>
  <text x="1020" y="739" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Argo CD (via kubectl)</text>
  <text x="1020" y="757" text-anchor="middle" font-size="12" fill="#374151">then watches this repo</text>

  <line x1="310" y1="743" x2="328" y2="743" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="590" y1="743" x2="608" y2="743" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="870" y1="743" x2="888" y2="743" class="flow" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <text x="600" y="807" text-anchor="middle" font-size="12" fill="#475569">Pull-based deployment: nothing outside the cluster needs SSH access to the server.</text>
</svg>
